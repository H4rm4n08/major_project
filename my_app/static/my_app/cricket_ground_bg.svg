<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fc46c"/>
      <stop offset="100%" stop-color="#1f9e4f"/>
    </linearGradient>
    <clipPath id="fieldClip">
      <ellipse cx="400" cy="400" rx="355" ry="355"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="800" height="800" fill="#eaf6ee"/>

  <ellipse cx="400" cy="400" rx="385" ry="385" fill="#15a35a"/>
  <ellipse cx="400" cy="400" rx="355" ry="355" fill="url(#turf)"/>

  <g clip-path="url(#fieldClip)" opacity="0.16">
    <circle cx="400" cy="400" r="60" fill="none" stroke="#0c6b34" stroke-width="40"/>
    <circle cx="400" cy="400" r="140" fill="none" stroke="#0c6b34" stroke-width="40"/>
    <circle cx="400" cy="400" r="220" fill="none" stroke="#0c6b34" stroke-width="40"/>
    <circle cx="400" cy="400" r="300" fill="none" stroke="#0c6b34" stroke-width="40"/>
    <circle cx="400" cy="400" r="380" fill="none" stroke="#0c6b34" stroke-width="40"/>
  </g>

  <circle cx="400" cy="400" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
  <circle cx="400" cy="400" r="355" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>

  <g>
    <rect x="382" y="290" width="36" height="220" fill="#dcc89a"/>
    <rect x="382" y="290" width="36" height="220" fill="none" stroke="#bda878" stroke-width="2"/>
    <line x1="382" y1="320" x2="418" y2="320" stroke="#bda878" stroke-width="2"/>
    <line x1="382" y1="480" x2="418" y2="480" stroke="#bda878" stroke-width="2"/>
    <g>
      <rect x="388" y="305" width="3" height="14" fill="#1e295d"/>
      <rect x="394" y="305" width="3" height="14" fill="#1e295d"/>
      <rect x="400" y="305" width="3" height="14" fill="#1e295d"/>
    </g>
    <g>
      <rect x="388" y="481" width="3" height="14" fill="#1e295d"/>
      <rect x="394" y="481" width="3" height="14" fill="#1e295d"/>
      <rect x="400" y="481" width="3" height="14" fill="#1e295d"/>
    </g>
  </g>

  <circle cx="400" cy="400" r="385" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.5">
    <circle cx="400" cy="400" r="370" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 14">
      <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="120s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
