{% extends 'my_app/base.html' %}
{% block title %}Fielding Positions – Dream Squad{% endblock %}

{% block content %}
<div class="squad-detail-page">

  <a class="cric-back" href="{% url 'my_app:squad_detail' squad.id %}">&#8592; {{ squad.squad_name }}</a>

  <div class="bowling-lineup-banner">Fielding Positions</div>

  <svg class="field-diagram" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="200" cy="205" rx="190" ry="180" fill="#5cab74" stroke="#2e7d52" stroke-width="4" />
    <ellipse cx="200" cy="205" rx="115" ry="108" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
    <rect x="183" y="130" width="34" height="150" fill="#d8c896" stroke="#bba86f" stroke-width="1" />
    <line x1="183" y1="150" x2="217" y2="150" stroke="#bba86f" stroke-width="1" />
    <line x1="183" y1="260" x2="217" y2="260" stroke="#bba86f" stroke-width="1" />

    {% for row in lineup %}
      <foreignObject x="{{ row.pill_x }}" y="{{ row.pill_y }}" width="100" height="28">
        <div xmlns="http://www.w3.org/1999/xhtml" class="field-pos-pill{% if row.squad_player %} filled{% endif %}">
          <a href="{% url 'my_app:squad_fielding_slot' squad.id row.slot %}" title="{{ row.label }}{% if row.squad_player.player.stats.overall_rating %} — OVR {{ row.squad_player.player.stats.overall_rating }}{% endif %}">
            {% if row.squad_player %}{{ row.squad_player.player.name }}{% else %}{{ row.label }}{% endif %}
          </a>
        </div>
      </foreignObject>
    {% endfor %}
  </svg>

  <p class="field-diagram-hint">Tap a position to search the squad and assign a player to it.</p>

</div>
{% endblock %}
